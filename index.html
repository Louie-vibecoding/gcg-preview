<title>GCG 先行卡情报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface-2:#EAECF3; --line:#DCE0EB; --line-strong:#C3C9DA;
  --text:#161A27; --muted:#5F6782; --accent:#B9761A; --accent-ink:#FFFFFF; --accent-soft:#FBF0DC;
  --c-blue:#2E6FC4; --c-green:#2F8D5C; --c-red:#C23A31; --c-purple:#7A4FD6; --c-white:#6C7386;
  --shadow:0 1px 2px rgba(20,26,45,.07), 0 8px 24px -12px rgba(20,26,45,.18);
  --ff-display:"Chakra Petch", "Noto Sans SC", system-ui, sans-serif;
  --ff-body:"Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D101B; --surface:#161B2C; --surface-2:#1D2337; --line:#262E46; --line-strong:#38415E;
    --text:#E9EBF3; --muted:#8A91AA; --accent:#F0A830; --accent-ink:#1B1405; --accent-soft:#2A2313;
    --c-blue:#4E93E8; --c-green:#45B87A; --c-red:#E8574C; --c-purple:#A483F0; --c-white:#C3CAD9;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0D101B; --surface:#161B2C; --surface-2:#1D2337; --line:#262E46; --line-strong:#38415E;
  --text:#E9EBF3; --muted:#8A91AA; --accent:#F0A830; --accent-ink:#1B1405; --accent-soft:#2A2313;
  --c-blue:#4E93E8; --c-green:#45B87A; --c-red:#E8574C; --c-purple:#A483F0; --c-white:#C3CAD9;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--ff-body); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding-inline:20px; padding-block:0}

/* ---------- header ---------- */
header{padding-block:34px 22px; border-bottom:1px solid var(--line)}
.eyebrow{
  font-family:var(--ff-display); font-size:12px; font-weight:600; letter-spacing:.18em;
  text-transform:uppercase; color:var(--muted); margin:0 0 8px
}
h1{
  font-family:var(--ff-display); font-weight:700; font-size:clamp(26px,4.6vw,38px);
  letter-spacing:.01em; line-height:1.2; margin:0; text-wrap:balance;
}
.sub{color:var(--muted); margin:10px 0 0; max-width:60ch; font-size:14px}
.sets{display:flex; flex-wrap:wrap; gap:12px; margin-top:22px}
.set-tile{
  flex:1 1 240px; background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:2px;
  border-left:3px solid var(--accent);
}
.set-tile.past{border-left-color:var(--line-strong); opacity:.72}
.set-code{font-family:var(--ff-display); font-size:12px; font-weight:700; letter-spacing:.14em; color:var(--muted)}
.set-name{font-weight:700; font-size:16px; line-height:1.35}
.set-meta{
  display:flex; align-items:baseline; gap:8px; margin-top:6px; flex-wrap:wrap;
  font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums;
}
.days{font-family:var(--ff-display); font-weight:700; font-size:20px; color:var(--accent); font-variant-numeric:tabular-nums}
.set-tile.past .days{color:var(--muted); font-size:14px}

/* ---------- filters ---------- */
.bar{
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--line); padding-block:12px; margin-bottom:4px;
}
.bar-inner{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center}
.group{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.glabel{
  font-family:var(--ff-display); font-size:11px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin-right:2px;
}
.chip{
  font:inherit; font-size:13px; line-height:1; cursor:pointer;
  background:var(--surface); color:var(--text); border:1px solid var(--line);
  border-radius:999px; padding:7px 12px; transition:background .12s, border-color .12s, color .12s;
}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.chip .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:baseline}
input[type="search"]{
  font:inherit; font-size:14px; color:var(--text); background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-width:200px; flex:1 1 200px;
}
input[type="search"]::placeholder{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.count{margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---------- list ---------- */
main{padding-block:8px 56px}
.day{
  display:flex; align-items:center; gap:12px; margin:26px 0 12px;
  font-family:var(--ff-display); font-size:13px; font-weight:600; letter-spacing:.1em; color:var(--muted);
}
.day::after{content:""; flex:1; height:1px; background:var(--line)}
.row{
  display:grid; grid-template-columns:300px minmax(0,1fr); gap:22px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:18px; margin-bottom:14px; box-shadow:var(--shadow);
}
.shot{border:0; background:none; padding:0; cursor:zoom-in; display:block; width:100%}
.shot img{width:100%; max-width:100%; height:auto; display:block; border-radius:8px}
.info{min-width:0; display:flex; flex-direction:column; gap:10px}
.idline{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.cardno{
  font-family:var(--ff-display); font-weight:700; font-size:14px; letter-spacing:.06em;
  color:var(--text); font-variant-numeric:tabular-nums;
}
.tag{
  font-family:var(--ff-display); font-size:11px; font-weight:700; letter-spacing:.1em;
  padding:2px 7px; border-radius:4px; border:1px solid var(--line-strong); color:var(--muted);
}
.tag.rarity{color:var(--accent); border-color:var(--accent)}
.tag.set{color:var(--muted)}
.cname{font-size:21px; font-weight:700; line-height:1.3; margin:0; text-wrap:balance}
.csub{font-family:var(--ff-display); font-size:13px; color:var(--muted); letter-spacing:.04em; margin-top:2px}
.stats{display:flex; flex-wrap:wrap; gap:8px}
.stat{
  background:var(--surface-2); border-radius:7px; padding:5px 10px; display:flex; align-items:baseline; gap:6px;
}
.stat b{font-family:var(--ff-display); font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
.stat span{font-family:var(--ff-display); font-size:10px; font-weight:600; letter-spacing:.12em; color:var(--muted)}
.meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; color:var(--muted)}
.pill{
  border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:12.5px; color:var(--text);
  background:var(--surface);
}
.pill.type{font-family:var(--ff-display); font-weight:700; letter-spacing:.1em; font-size:11px}
.pill.col{border-color:currentColor; font-weight:500}
.link-req{font-size:13px; color:var(--muted)}
.link-req b{color:var(--text); font-weight:500}
.fx{display:flex; flex-direction:column; gap:7px; margin:0; padding:0; list-style:none}
.fx li{
  font-size:14px; line-height:1.7; padding-left:11px; border-left:2px solid var(--line-strong);
}
.fx .kw{color:var(--accent); font-weight:700}
.fx .tr{color:var(--muted)}
.foot{
  display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin-top:2px;
  padding-top:10px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--muted);
}
.foot a{color:var(--muted); text-decoration:underline; text-underline-offset:2px}
.foot a:hover{color:var(--accent)}
.warn{
  background:var(--accent-soft); border:1px solid var(--accent); color:var(--text);
  border-radius:7px; padding:7px 11px; font-size:12.5px; line-height:1.5;
}
.empty{text-align:center; color:var(--muted); padding:60px 20px}

/* ---------- lightbox ---------- */
dialog{
  border:0; padding:0; background:transparent; max-width:100vw; max-height:100vh;
  overscroll-behavior:contain;
}
dialog::backdrop{background:rgba(6,8,14,.82)}
dialog img{
  display:block; width:450px; max-width:calc(100vw - 24px); height:auto; border-radius:10px;
}
.close{
  position:fixed; top:14px; right:14px; font:inherit; font-size:14px; cursor:pointer;
  background:var(--surface); color:var(--text); border:1px solid var(--line-strong);
  border-radius:8px; padding:7px 13px;
}
footer{border-top:1px solid var(--line); padding-block:20px 40px; color:var(--muted); font-size:12.5px}
footer a{color:var(--muted)}

@media (max-width:760px){
  .row{grid-template-columns:1fr; gap:16px}
  .shot{max-width:340px; margin:0 auto}
  .count{margin-left:0; width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>

const COLORS = {"蓝":"var(--c-blue)","绿":"var(--c-green)","红":"var(--c-red)","紫":"var(--c-purple)","白":"var(--c-white)"};
const TYPES = ["UNIT","PILOT","COMMAND","BASE"];
const state = {set:null, type:null, color:null, q:""};

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); };
const daysTo = iso => {
  const [y,m,d] = iso.split("-").map(Number);
  return Math.round((new Date(y,m-1,d) - today()) / 86400000);
};

/* ---- set countdown tiles ---- */
(function sets(){
  const map = new Map();
  for (const c of CARDS) {
    if (!map.has(c.set)) map.set(c.set, {code:c.set, name:c.set_name, release:c.release, n:0});
    map.get(c.set).n++;
  }
  const arr = [...map.values()].sort((a,b) => a.release.localeCompare(b.release));
  document.getElementById("sets").innerHTML = arr.map(s => {
    const d = daysTo(s.release);
    const past = d < 0;
    const when = past ? "已发售" : d === 0 ? "今天发售" : `还有 <span class="days">${d}</span> 天`;
    return `<div class="set-tile${past ? " past" : ""}">
      <span class="set-code">${esc(s.code)}</span>
      <span class="set-name">${esc(s.name)}</span>
      <span class="set-meta"><span>${esc(s.release)} 发售</span><span>·</span><span>已公开 ${s.n} 张</span></span>
      <span class="set-meta">${when}</span>
    </div>`;
  }).join("");
})();

/* ---- filter chips ---- */
function chips(host, key, items, withDot){
  const el = document.getElementById(host);
  el.insertAdjacentHTML("beforeend",
    `<button class="chip" data-k="${key}" data-v="" aria-pressed="true">全部</button>` +
    items.map(v => {
      const dot = withDot ? `<i class="dot" style="background:${COLORS[v]}"></i>` : "";
      return `<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="false">${dot}${esc(v)}</button>`;
    }).join(""));
}
chips("f-set", "set", [...new Set(CARDS.map(c => c.set))].sort());
chips("f-type", "type", TYPES.filter(t => CARDS.some(c => c.type === t)));
chips("f-color", "color", Object.keys(COLORS).filter(k => CARDS.some(c => c.color === k)), true);

document.addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  const k = b.dataset.k;
  state[k] = b.dataset.v || null;
  for (const s of document.querySelectorAll(`.chip[data-k="${k}"]`)) {
    s.setAttribute("aria-pressed", String((s.dataset.v || null) === state[k]));
  }
  render();
});
document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value.trim().toLowerCase();
  render();
});

/* ---- effect text markup ---- */
const fx = t => esc(t)
  .replace(/【[^】]+】/g, m => `<span class="kw">${m}</span>`)
  .replace(/〈[^〉]+〉/g, m => `<span class="tr">${m}</span>`);

function statRow(c){
  const out = [];
  if (c.level != null) out.push(["LV", c.level]);
  if (c.cost != null) out.push(["COST", c.cost]);
  if (c.ap != null) out.push(["AP", c.ap]);
  if (c.hp != null) out.push(["HP", c.hp]);
  return out.map(([k, v]) => `<span class="stat"><b>${esc(v)}</b><span>${k}</span></span>`).join("");
}

function card(c){
  const zones = c.zones && c.zones.length ? `<span class="pill">${c.zones.map(esc).join(" · ")}</span>` : "";
  const traits = (c.traits || []).map(t => `<span class="pill">〈${esc(t)}〉</span>`).join("");
  const link = c.link ? `<p class="link-req">LINK 条件：<b>${esc(c.link)}</b></p>` : "";
  const effects = (c.effects || []).length
    ? `<ul class="fx">${c.effects.map(t => `<li>${fx(t)}</li>`).join("")}</ul>`
    : `<p class="link-req">（无效果文字）</p>`;
  const warn = (c.uncertain || []).length
    ? `<p class="warn">⚠ 待核对字段：${c.uncertain.map(esc).join("、")} —— 请以卡图为准</p>`
    : "";
  return `<article class="row">
    <button class="shot" data-img="${esc(c.img)}" aria-label="放大查看 ${esc(c.name)}">
      <img src="${esc(c.img)}" alt="${esc(c.card_no)} ${esc(c.name)}" loading="lazy" width="450" height="614">
    </button>
    <div class="info">
      <div class="idline">
        <span class="cardno">${esc(c.card_no)}</span>
        ${c.rarity ? `<span class="tag rarity">${esc(c.rarity)}</span>` : ""}
        <span class="tag set">${esc(c.set)}</span>
      </div>
      <div>
        <h2 class="cname">${esc(c.name)}</h2>
        ${c.name_sub ? `<div class="csub">${esc(c.name_sub)}</div>` : ""}
      </div>
      <div class="stats">${statRow(c)}</div>
      <div class="meta">
        <span class="pill type">${esc(c.type)}</span>
        <span class="pill col" style="color:${COLORS[c.color] || "var(--muted)"}">${esc(c.color)}</span>
        ${zones}${traits}
      </div>
      ${link}
      ${effects}
      ${warn}
      <div class="foot">
        <span>公开于 ${esc(c.pub_time)}</span>
        <span>${esc(c.release)} 发售</span>
        <a href="${esc(c.post_url)}" target="_blank" rel="noopener">B 站原帖 ↗</a>
      </div>
    </div>
  </article>`;
}

function render(){
  let rows = CARDS.filter(c =>
    (!state.set || c.set === state.set) &&
    (!state.type || c.type === state.type) &&
    (!state.color || c.color === state.color));
  if (state.q) {
    rows = rows.filter(c => [c.name, c.name_sub, c.card_no, c.link, (c.traits || []).join(" "), (c.effects || []).join(" ")]
      .join(" ").toLowerCase().includes(state.q));
  }
  document.getElementById("count").textContent = `${rows.length} / ${CARDS.length} 张`;

  const list = document.getElementById("list");
  if (!rows.length) { list.innerHTML = `<p class="empty">没有符合条件的卡牌。</p>`; return; }

  let html = "", day = "";
  for (const c of rows) {
    const d = c.pub_time.slice(0, 10);
    if (d !== day) { day = d; html += `<div class="day">${esc(d)} 公开</div>`; }
    html += card(c);
  }
  list.innerHTML = html;
}

/* ---- lightbox ---- */
const lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg");
document.addEventListener("click", e => {
  const s = e.target.closest(".shot");
  if (!s) return;
  lbimg.src = s.dataset.img;
  lbimg.alt = s.querySelector("img").alt;
  lb.showModal();
});
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });

render();
document.getElementById("stamp").textContent = `　·　共 ${CARDS.length} 张，最近公开 ${CARDS[0].pub_time}`;
</script>
